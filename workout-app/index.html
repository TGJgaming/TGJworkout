<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Minimalist progressive bodyweight workout tracker">

  <title>Workout Tracker</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Inline SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sticky Header -->
    <header class="app-header">
      <!-- Day Selector -->
      <nav class="day-selector" id="day-selector" aria-label="Day of week selector"></nav>
      <!-- Progress Bar (shown during strength sessions) -->
      <div id="progress-section" class="hidden"></div>
    </header>

    <!-- Main Content Area -->
    <main id="app-content"></main>
  </div>

  <!-- Rest Timer Overlay (fixed at bottom) -->
  <div class="rest-timer-overlay" id="rest-timer-overlay">
    <div class="rest-timer-label">Rest</div>
    <div class="rest-timer-time">01:30</div>
    <div class="rest-timer-next"></div>
    <div class="rest-timer-controls">
      <button class="btn btn-primary btn-sm" id="rest-skip-btn">Skip Rest</button>
      <button class="btn btn-secondary btn-sm" id="rest-add-15-btn">+15s</button>
      <button class="btn btn-secondary btn-sm" id="rest-add-30-btn">+30s</button>
    </div>
  </div>

  <!-- App Scripts (ES Modules) -->
  <script type="module">
    import { initApp, setupRestTimerControls } from './js/ui.js';

    // Initialize app
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
      setupRestTimerControls();
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
